kind = "web"
previewPath = "/"
title = "GamePortal - Jeux Téléchargeables"
version = "1.0.0"
id = "artifacts/gameportal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19763

[services.development]
run = "pnpm --filter @workspace/gameportal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gameportal", "run", "build" ]
publicDir = "artifacts/gameportal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19763"
BASE_PATH = "/"
