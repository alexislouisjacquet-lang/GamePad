packages:
  "framer-motion": "For fluid page transitions, hover effects, and cyberpunk animations"
  "lucide-react": "For beautiful vector icons"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility function to efficiently merge Tailwind CSS classes"
  "react-hook-form": "For robust form handling in the review section"
  "@hookform/resolvers": "Zod validation resolver for react-hook-form"
  "zod": "Schema validation for forms"
  "date-fns": "Human-readable date formatting for reviews and release dates"

images:
  - path: "artifacts/gameportal/public/images/hero-bg.png"
    description: "Dark cyberpunk cityscape at night with intense neon purple and electric cyan lights, high-tech hacking gaming atmosphere, abstract geometric shapes, atmospheric fog, no text"
    aspect_ratio: "21:9"

notes:
  - Uses TanStack Query hooks natively generated by Orval and exposed via @workspace/api-client-react
  - Incorporates Framer Motion for premium, non-generic UI interactions
